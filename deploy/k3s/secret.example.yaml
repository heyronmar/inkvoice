# Copy to secret.yaml (keep it out of git) and apply it, or create it directly:
#   kubectl create secret generic inkvoice \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ADMIN_PASS='your-strong-password'
apiVersion: v1
kind: Secret
metadata:
  name: inkvoice
type: Opaque
stringData:
  JWT_SECRET: "replace-with-openssl-rand-base64-48"
  ADMIN_PASS: "replace-with-a-strong-password"
  # Optional, see docs/guide/configuration.md:
  # STRIPE_SECRET_KEY: ""
  # STRIPE_PUBLISHABLE_KEY: ""
  # STRIPE_WEBHOOK_SECRET: ""
  # SMTP_PASS: ""
